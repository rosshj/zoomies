name: checks

# Node-only checks: fast and dependency-free apart from the vendored three.js
# (no `npm install`). Anything that needs a browser — the headless smoke test,
# offline test, split-screen and gamepad checks — is left to run locally.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: world-config codec (cup reload token)
        run: npm run check:worldcfg
      - name: progression economy (treats/unlocks/cups)
        run: npm run check:progress
      - name: kart sim determinism
        run: npm run check:sim
