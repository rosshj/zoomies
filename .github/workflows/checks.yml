name: checks

# Node-only netcode checks: fast, dependency-free (no `npm install`), and the
# regression gate the multiplayer overhaul relies on. Anything that imports three.js
# or needs a browser — the headless smoke test, offline test, and the determinism
# check (`check:sim`, which steps a real Kart) — is left to run locally.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  netcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: net unit checks
        run: npm run check:net
      - name: netsim harness + baseline
        run: npm run check:netsim
      - name: binary pose codec
        run: npm run check:codec
      - name: race referee (lag-comp/hits/laps/finish)
        run: npm run check:referee
      - name: multiplayer world-config codec
        run: npm run check:worldcfg
      - name: progression economy (treats/unlocks/cups)
        run: npm run check:progress
