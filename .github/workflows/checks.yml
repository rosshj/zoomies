name: checks

# Node-only checks. The kart-sim check imports `three` from node_modules
# (kart.js says `from "three"`, which only the browser's import map points at
# the vendored build), so the lockfile is installed first — scripts skipped,
# no browsers. Anything that needs a browser — the headless smoke test,
# offline test, split-screen and gamepad checks — is left to run locally.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: world-config codec (cup reload token)
        run: npm run check:worldcfg
      - name: progression economy (treats/unlocks/cups)
        run: npm run check:progress
      - name: cat roster, unlocks and save migration
        run: npm run check:cat-roster
      - name: kart sim determinism
        run: npm run check:sim
      - name: item and knockable prop logic
        run: npm run check:items

      - name: prop road/fence clearance and settling
        run: npm run check:prop-physics
      - name: biome road prop placement, reactions and budgets
        run: npm run check:biome-props
      - name: environmental particle budgets and emission timing
        run: npm run check:environment-particles
      - name: procedural baked-lighting invariants
        run: npm run check:baked-lighting
      - name: procedural LOD and world-shelter invariants
        run: npm run check:runtime-art
