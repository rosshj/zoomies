# Cloudflare Worker config for the optional Zoomies race referee (Stage 4).
# Deploy steps + what you need to do on your end: see DEPLOY.md.
#
# Runs on the Workers FREE plan: Durable Objects are free there when they use the
# SQLite storage backend, which is why the migration below is `new_sqlite_classes`
# (the classic key-value backend is paid-only). We keep all state in memory, so no
# storage is actually written — the SQLite backend is just the free-tier ticket.

name = "zoomies-referee"
main = "worker.js"
compatibility_date = "2025-01-01"

# The Durable Object namespace the Worker talks to (env.RACE_REFEREE).
[[durable_objects.bindings]]
name = "RACE_REFEREE"
class_name = "RaceReferee"

# SQLite-backed DO class — required for the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaceReferee"]

# Default race distance the referee validates finishes against. Override per
# deployment if you change TOTAL_LAPS in the game.
[vars]
TOTAL_LAPS = "3"
