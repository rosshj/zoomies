<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Zoomies · WebGPU vs WebGL light/object stress test</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f; font-family: -apple-system, system-ui, sans-serif; }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    #hud {
      position: fixed; left: 0; right: 0; top: 0;
      padding: max(12px, env(safe-area-inset-top)) 14px 12px;
      display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline;
      font-size: 13px; line-height: 1.3; color: #dfe9ff;
      background: linear-gradient(#05070fcc, #05070f00);
      pointer-events: none; user-select: none;
    }
    #fps { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
    #fps small { font-size: 12px; font-weight: 400; opacity: 0.7; }
    .stat b { font-weight: 700; font-variant-numeric: tabular-nums; }
    #backend { padding: 2px 8px; border-radius: 999px; font-weight: 700; }
    #backend.gpu { background: #1f6f3f; color: #d6ffe6; }
    #backend.gl { background: #7a4a1f; color: #ffe6c8; }

    #panel {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 12px 14px max(14px, env(safe-area-inset-bottom));
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
      background: linear-gradient(#05070f00, #05070fdd 38%);
    }
    button {
      appearance: none; border: 1px solid #2c3a5a; background: #131c30; color: #e8f0ff;
      font-size: 15px; font-weight: 600; padding: 13px 10px; border-radius: 12px;
      touch-action: manipulation;
    }
    button:active { background: #1d2a44; }
    button.wide { grid-column: 1 / -1; }
    .swap { background: #24344f; }
    .hint { grid-column: 1 / -1; font-size: 11px; opacity: 0.6; text-align: center; padding-top: 2px; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.webgpu.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.tsl.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud">
    <span id="fps">–<small> fps</small></span>
    <span id="backend">starting…</span>
    <span class="stat">lights <b id="nLights">0</b></span>
    <span class="stat">objects <b id="nObjects">0</b></span>
    <span class="stat">res <b id="res">–</b></span>
  </div>

  <div id="panel">
    <button data-act="lights+">+8 lights</button>
    <button data-act="lights-">−8 lights</button>
    <button data-act="objects+">+40 objects</button>
    <button data-act="objects-">−40 objects</button>
    <button class="wide swap" data-act="swap">Switch backend &amp; reload</button>
    <div class="hint" id="hint"></div>
  </div>

  <script type="module">
    import * as THREE from "three/webgpu";

    // ?backend=webgl forces the WebGL2 path through the SAME renderer/material
    // code, so the two modes are an apples-to-apples comparison on your device.
    const params = new URLSearchParams(location.search);
    const forceWebGL = params.get("backend") === "webgl";

    const canvas = document.getElementById("c");
    const renderer = new THREE.WebGPURenderer({ canvas, antialias: true, forceWebGL });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b18);
    scene.fog = new THREE.Fog(0x070b18, 120, 520);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 2000);

    // Dim ambient so the dynamic point/spot lights are what you actually see — the
    // whole point is to measure how many moving lights the device can push.
    scene.add(new THREE.HemisphereLight(0x33456a, 0x05070f, 0.25));

    // Big toy-ground so there's plenty of lit surface (this is where light count
    // bites in a forward renderer — every lit pixel pays for every light).
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(900, 900, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0x9fb0c8, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // ---- dynamic objects (stand-ins for karts / props / scenery) ----
    const objects = [];
    const objGeo = new THREE.BoxGeometry(2.4, 2.4, 4);
    function addObjects(n) {
      for (let i = 0; i < n; i++) {
        const hue = Math.random();
        const m = new THREE.Mesh(
          objGeo,
          new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(hue, 0.6, 0.5), roughness: 0.7 })
        );
        const a = Math.random() * Math.PI * 2, r = 20 + Math.random() * 200;
        m.userData = { a, r, spin: (Math.random() - 0.5) * 2, speed: 0.1 + Math.random() * 0.5 };
        m.position.set(Math.cos(a) * r, 1.4, Math.sin(a) * r);
        scene.add(m);
        objects.push(m);
      }
    }
    function removeObjects(n) {
      for (let i = 0; i < n && objects.length; i++) {
        const m = objects.pop();
        scene.remove(m);
        m.material.dispose();
      }
    }

    // ---- dynamic lights (moving point lights with a visible bulb) ----
    const lights = [];
    const bulbGeo = new THREE.SphereGeometry(0.6, 8, 8);
    function addLights(n) {
      for (let i = 0; i < n; i++) {
        const col = new THREE.Color().setHSL(Math.random(), 0.7, 0.55);
        const light = new THREE.PointLight(col, 40, 70, 1.6);
        const bulb = new THREE.Mesh(bulbGeo, new THREE.MeshBasicMaterial({ color: col }));
        light.add(bulb);
        const a = Math.random() * Math.PI * 2, r = 30 + Math.random() * 220;
        light.userData = { a, r, h: 5 + Math.random() * 10, speed: 0.2 + Math.random() * 0.7 };
        scene.add(light);
        lights.push(light);
      }
    }
    function removeLights(n) {
      for (let i = 0; i < n && lights.length; i++) {
        const l = lights.pop();
        scene.remove(l);
      }
    }

    // Start with a load the old WebGL game would already find heavy at night.
    addObjects(80);
    addLights(16);

    // ---- HUD ----
    const $ = (id) => document.getElementById(id);
    function refreshCounts() {
      $("nLights").textContent = lights.length;
      $("nObjects").textContent = objects.length;
    }
    refreshCounts();
    $("hint").textContent = forceWebGL
      ? "Forcing WebGL2. Tap switch to try WebGPU."
      : "Trying WebGPU (falls back to WebGL2 if unsupported).";

    document.getElementById("panel").addEventListener("click", (e) => {
      const act = e.target.getAttribute("data-act");
      if (act === "lights+") addLights(8);
      else if (act === "lights-") removeLights(8);
      else if (act === "objects+") addObjects(40);
      else if (act === "objects-") removeObjects(40);
      else if (act === "swap") {
        params.set("backend", forceWebGL ? "webgpu" : "webgl");
        location.search = params.toString();
        return;
      }
      refreshCounts();
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight, false);
    });

    // ---- frame loop + fps meter ----
    let frames = 0, fpsAccum = 0, lastFpsT = performance.now();
    function tick(t) {
      const time = t * 0.001;
      camera.position.set(Math.cos(time * 0.12) * 230, 120, Math.sin(time * 0.12) * 230);
      camera.lookAt(0, 0, 0);

      for (const m of objects) {
        const u = m.userData;
        u.a += u.speed * 0.016;
        m.position.set(Math.cos(u.a) * u.r, 1.4, Math.sin(u.a) * u.r);
        m.rotation.y += u.spin * 0.016;
      }
      for (const l of lights) {
        const u = l.userData;
        u.a += u.speed * 0.016;
        l.position.set(Math.cos(u.a) * u.r, u.h, Math.sin(u.a) * u.r);
      }

      renderer.render(scene, camera);

      // fps: rolling, updated ~5x/sec
      frames++;
      const now = performance.now();
      if (now - lastFpsT >= 200) {
        const fps = Math.round((frames * 1000) / (now - lastFpsT));
        $("fps").innerHTML = fps + '<small> fps</small>';
        frames = 0; lastFpsT = now;
      }
    }

    // WebGPURenderer is async: init() picks the backend, then we can read which one
    // actually ended up active and report the real device resolution.
    renderer.init().then(() => {
      const b = renderer.backend && renderer.backend.constructor ? renderer.backend.constructor.name : "";
      const isGPU = /WebGPU/i.test(b) || (!!navigator.gpu && !forceWebGL && !/WebGL/i.test(b));
      const tag = $("backend");
      tag.textContent = isGPU ? "WebGPU" : "WebGL2";
      tag.className = isGPU ? "gpu" : "gl";
      const pr = renderer.getPixelRatio();
      $("res").textContent = Math.round(window.innerWidth * pr) + "×" + Math.round(window.innerHeight * pr);
      renderer.setAnimationLoop(tick);
    }).catch((err) => {
      $("backend").textContent = "init failed";
      $("hint").textContent = String(err && err.message ? err.message : err);
    });
  </script>
</body>
</html>
