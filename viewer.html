<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Zoomies GP — Asset Viewer</title>
  <link rel="icon" href="./apple-touch-icon.png" />
  <!-- Dev tool: browse every procedural asset the game builds (cats, karts,
       props, scenery, landmarks) and inspect each one in 3D — drag to spin,
       pinch/scroll to zoom. Loads the SAME modules the game runs, so what you
       see here is exactly what ships. Same vendored import map as index.html. -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.webgpu.min.js",
        "three/webgpu": "./vendor/three/three.webgpu.min.js",
        "three/tsl": "./vendor/three/three.tsl.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      display: flex;
      background: #0e1320;
      color: #eef1f8;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #side {
      width: 272px;
      flex: none;
      display: flex;
      flex-direction: column;
      background: #141b2e;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }
    #side header { padding: 14px 14px 10px; }
    #side h1 { font-size: 15px; letter-spacing: 0.04em; }
    #side h1 span { color: #ffd54f; }
    #side .sub { font-size: 11px; color: #9aa4bd; margin-top: 2px; }
    #search {
      margin: 0 12px 10px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #0e1320;
      color: #eef1f8;
      font-size: 13px;
      outline: none;
    }
    #list { flex: 1; overflow-y: auto; padding: 0 8px 16px; }
    #list h3 {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #8b96b3;
      padding: 14px 8px 5px;
    }
    #list button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 7px 10px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #dfe5f2;
      font-size: 13px;
      cursor: pointer;
    }
    #list button:hover { background: rgba(255, 255, 255, 0.06); }
    #list button.selected { background: #ffd54f; color: #201a06; font-weight: 600; }
    #main { flex: 1; position: relative; }
    #main canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #info {
      position: absolute;
      left: 12px;
      bottom: 10px;
      font-size: 12px;
      color: #c6cede;
      background: rgba(10, 14, 25, 0.72);
      padding: 6px 10px;
      border-radius: 8px;
      pointer-events: none;
      max-width: min(92%, 560px);
    }
    #spin-btn {
      position: absolute;
      right: 12px;
      top: 10px;
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(10, 14, 25, 0.72);
      color: #eef1f8;
      font-size: 12px;
      cursor: pointer;
    }
    #spin-btn.on { border-color: #ffd54f; color: #ffd54f; }
    #side-toggle { display: none; }
    @media (max-width: 720px) {
      #side {
        position: fixed;
        inset: 0 auto 0 0;
        transform: translateX(-100%);
        transition: transform 0.22s ease;
        box-shadow: 6px 0 24px rgba(0, 0, 0, 0.5);
      }
      #side.open { transform: none; }
      #side-toggle {
        display: block;
        position: absolute;
        left: 12px;
        top: 10px;
        z-index: 20;
        padding: 7px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(10, 14, 25, 0.72);
        color: #eef1f8;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <aside id="side">
    <header>
      <h1>🐱 ZOOMIES GP <span>asset viewer</span></h1>
      <p class="sub">Drag to spin · pinch / scroll to zoom</p>
    </header>
    <input id="search" type="search" placeholder="Filter assets…" autocomplete="off" />
    <nav id="list"></nav>
  </aside>
  <main id="main">
    <button id="side-toggle">☰ Assets</button>
    <button id="spin-btn" class="on">⟳ Auto-spin</button>
    <div id="info">Loading renderer…</div>
  </main>
  <script type="module" src="./src/viewer.js"></script>
</body>
</html>
